# The only file you need to edit to make this app yours.

# The name under the icon on the phone.
appName=Release Kit

# The app's permanent identity on the phone. Pick it once and never change it: a different
# id is a different app, installed side by side, with none of the old one's data.
# Lowercase letters, digits, dots and underscores; at least one dot. Reverse-domain style,
# e.g. io.github.yourname.myapp.
applicationId=io.github.example.releasekit

# The first two parts of every version name. CI adds the third: 1.0.<build number>.
versionPrefix=1.0

# Leave at 0 for a new app. If phones already have a hand-built version of this app
# installed, set this above that version's versionCode so CI builds install as updates.
versionCodeOffset=0
